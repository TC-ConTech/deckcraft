[package]
name = "deckcraft-fonts"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft fonts: font database (craft-fonts + system), substitutes for Office fonts, metrics, outlines, shaping"

[lints]
workspace = true

[features]
# Preserve the ordinary app's existing fallback and installed-font behavior.
# Embedders can instead provide reviewed Inter Regular through CRAFT_FONTS_DIR.
default = ["legacy-fallback-font", "system-fonts"]
legacy-fallback-font = ["dep:epaint_default_fonts"]
system-fonts = []

[dependencies]
kurbo = { workspace = true }
skrifa = { workspace = true }
harfrust = { workspace = true }
unicode-bidi = { workspace = true }
log = { workspace = true }
# Last-resort face only (Ubuntu Light); no UI code.
epaint_default_fonts = { version = "0.37", optional = true }
